# The scripts under atlas/ and the site build, on Linux, macOS and Windows.
# The default environment runs the generators and mkdocs. The `render`
# environment adds Blender itself as the official `bpy` wheel from PyPI
# (Blender 4.5 as a Python module, with Cycles and OpenImageDenoise), so the
# renders need no separately installed Blender: `pixi run render`.
[workspace]
name = "mouse-joysticks-mech"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
# pixi fetches a conda-to-PyPI name map before solving PyPI dependencies; the
# empty local map skips that download, which fails on some networks, and is
# correct here because nothing in the render environment is on both sides.
conda-pypi-map = { "conda-forge" = "atlas/empty-conda-pypi-map.json" }

[dependencies]
python = ">=3.11,<3.14"
pyyaml = ">=6"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5,<10"

[tasks]
build = { cmd = "python atlas/build.py", description = "Resolve the registry against the model and write atlas/job.json" }
check = { cmd = "python atlas/build.py --check && python atlas/bom.py --check", description = "Are the renders current and every part node covered?" }
bom = { cmd = "python atlas/bom.py", description = "docs/bom-mechanical.md from the model through the registry" }
pages = { cmd = "python atlas/pages.py && python atlas/site_pages.py", description = "The component, station and site pages from the registry" }
overlay = { cmd = "python atlas/overlay.py docs/renders", description = "Clickable SVG overlays and callout legends from the hotspot files" }
generate = { depends-on = ["bom", "pages", "overlay"], description = "Everything generated except the renders" }
site = { cmd = "mkdocs build && mkdir -p site/model && cp mouse-joysticks.glb atlas/boards/*.glb site/model/", depends-on = ["generate"], description = "Build the atlas site into site/" }
serve = { cmd = "mkdocs serve", description = "Serve the site locally (the model files are served only after `pixi run site`)" }

[feature.render.dependencies]
python = "3.11.*"          # the bpy wheels are built for 3.11
pyyaml = ">=6"

[feature.render.pypi-dependencies]
bpy = ">=4.5,<4.6"

[feature.render.tasks]
render = { cmd = "python atlas/build.py && python atlas/render.py atlas/job.json docs/renders", description = "Render every view into docs/renders (about an hour)" }
preview = { cmd = "python atlas/build.py && python atlas/render.py atlas/job.json tmp/preview --preview --views", description = "Low-quality renders of the named views into tmp/preview, e.g. `pixi run preview rig-iso,part-brake`" }
render-views = { cmd = "python atlas/build.py && python atlas/render.py atlas/job.json docs/renders --views", description = "Full-quality renders of the named views only into docs/renders (the manifest records them as rendered alone), e.g. `pixi run render-views boards-in-place`" }

[feature.manual.dependencies]
python = ">=3.11"
pyyaml = ">=6"
pandoc = ">=3.6"
typst = ">=0.13"

[feature.manual.tasks]
manual = { cmd = "python manual/build.py", description = "The PDF manual into tmp/manual/, assembled from the repositories' pages (manual/manifest.yaml); `pixi run manual --md-only` for just the Markdown" }

[environments]
render = { features = ["render"], no-default-feature = true }
manual = { features = ["manual"], no-default-feature = true }
