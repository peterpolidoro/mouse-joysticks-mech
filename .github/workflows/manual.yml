# Builds the PDF manual and attaches it to the release it was triggered by.
# The manual is assembled from the repositories' Markdown at the revisions
# named in manual/manifest.yaml, read from GitHub (there are no sibling
# checkouts here), and typeset with pandoc and typst from the pixi `manual`
# environment. Run it by hand (workflow_dispatch) to get the PDF as a
# workflow artifact without a release.
name: manual
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: manual
      - run: pixi run -e manual manual --out dist/
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: dist/*.pdf
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.pdf --clobber
