# Builds the atlas site from docs/ and deploys it to GitHub Pages.
# Renders are committed (Blender does not run here); the generated pages are
# committed too, so the build is mkdocs plus copying the model files.
# Pages must be set to "GitHub Actions" as its source in the repository
# settings for the deploy step to work.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5,<10" pyyaml
      - run: mkdocs build
      - run: mkdir -p site/model && cp mouse-joysticks.glb atlas/boards/*.glb site/model/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
