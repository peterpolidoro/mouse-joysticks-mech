# ----------------------------------------------------------------- boards

- id: joystick-board
  name: Joystick controller board
  kind: board
  station: both
  repository: mouse-joystick-pcb
  tag: v1.0
  model: atlas/boards/mouse-joystick-pcb.glb
  description: >-
    One per station: RP2040, TMC5130A driver, brake current sink, torque
    bridge, angle and torque analog outputs, pyControl UART on an RJ-45.
    Placement in the renders follows the 2026-09-21 placement study and is not
    a fixture.
  docs:
    - mouse-joystick-pcb/README.md
    - mouse-joystick-pcb/docs/interface-map.md
    - mouse-joystick-pcb/docs/rig-layout.md
  render: true
  bom: false

- id: camera-board
  name: Camera GPIO interface board
  kind: board
  station: rig
  repository: camera-gpio-interface-pcb
  # v1.0 is the fabricated revision (order 1, 2026-09-26, from 5ddb425; the
  # copper unchanged since), tagged on the documented state of 2026-10-15 as
  # the joystick board's v1.0 was. The tag must exist on GitHub before this
  # page is regenerated and pushed, else set main here.
  tag: v1.0
  model: atlas/boards/camera-gpio-interface-pcb.glb
  description: Between pyControl and the three Blackfly S cameras; strobes and sync to the OneBox. Rig 1 only.
  docs: [camera-gpio-interface-pcb/README.md]
  render: true
  bom: false

- id: pycontrol-controller
  name: pyControl controller
  kind: board
  station: rig
  description: pyboard PYBv1.1 on a Breakout 1.2; left joystick on port 1, right on port 4, solenoid on port 5.
  docs:
    - mouse-joystick-firm/pycontrol/README.md
    - mouse-joystick-pcb/docs/pycontrol-port-pinout.md
  render: false
  bom: false

# ----------------------------------------------------------------- cables

- id: harness
  name: Joystick harness (motor, encoder, limit switch)
  kind: cable
  station: both
  description: >-
    Left and right variants; the left swaps one coil pair and A/B so the
    boards and firmware are identical. Label them.
  connects_to:
    - {board: mouse-joystick-pcb, connector: J1102}
    - {board: mouse-joystick-pcb, connector: J1103}
    - {board: mouse-joystick-pcb, connector: J1601}
  docs: [mouse-joystick-pcb/docs/harness-pinouts.md]
  wireviz: mouse-joystick-pcb/docs/harness/left.yaml, mouse-joystick-pcb/docs/harness/right.yaml
  render: false

- id: brake-lead
  name: Brake coil lead
  kind: cable
  station: both
  connects_to: [{board: mouse-joystick-pcb, connector: J1801}]
  docs: [mouse-joystick-pcb/docs/interface-map.md]
  render: false

- id: torque-lead
  name: Torque sensor lead
  kind: cable
  station: both
  description: "Five conductors, shielded: excitation, signal pair, ground, shield."
  connects_to: [{board: mouse-joystick-pcb, connector: J2001}]
  docs: [mouse-joystick-pcb/docs/interface-map.md]
  render: false

- id: rj45-link
  name: pyControl link
  kind: cable
  station: both
  description: Straight Ethernet patch cable; pins 1, 2, 4 and 6 used.
  connects_to: [{board: mouse-joystick-pcb, connector: J301}]
  docs: [mouse-joystick-pcb/docs/pycontrol-port-pinout.md]
  render: false

- id: analog-outputs
  name: Angle and torque BNC runs
  kind: cable
  station: both
  connects_to:
    - {board: mouse-joystick-pcb, connector: J1101}
    - {board: mouse-joystick-pcb, connector: J901}
  docs: [mouse-joystick-pcb/docs/onebox-analog-interface.md]
  render: false

- id: supply-36v
  name: 36 V motor supply
  kind: cable
  station: both
  connects_to: [{board: mouse-joystick-pcb, connector: J501}]
  docs: [mouse-joystick-pcb/docs/power.md]
  render: false

