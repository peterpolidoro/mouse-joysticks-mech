# Component registry of the joystick rig.
#
# One entry per thing a reader can point at: the mechanical parts of the two
# joystick stations, the boards, the cables and the external endpoints. Every
# render list, exploded-view offset, hotspot, callout number, component page,
# BOM row and the firmware repository's circuit-to-code map is generated from
# this file; nothing downstream is written by hand.
#
# Conventions
#   id          kebab-case, stable; file names and anchors derive from it
#   kind        mechanical | board | cable | external
#   station     left | right | both | rig   (both = one instance per station)
#   gltf_nodes  glob patterns matched against node names in mouse-joysticks.glb
#               (the Inventor product names). Blender appends ".NNN" to a
#               duplicate name on import; the matcher strips that suffix first.
#               A pattern that matches nothing is an error.
#   station map in the glTF (confirmed from the part names, 2026-10-13):
#               right = "GEAR DRIVEN SINGLE LEVER:1" (Z > 0)
#               left  = "GEAR DRIVEN SINGLE LEVER:2" (Z < 0; carries the
#                       mirrored MOTOR MOUNT PLATE_MIR and DRIVEN SPUR GEAR MIR,
#                       and takes the LEFT harness)
#   connects_to board connector a cable or part reaches, by reference
#               designator of mouse-joystick-pcb v1.0 unless `board` says otherwise
#   block_instance  the schematic block (`<parent sheet>/<instance>`) whose
#               page the PCB repository publishes on its site
#               (https://peterpolidoro.github.io/mouse-joystick-pcb/generated/blocks/<instance>/,
#               live since 2026-10-14); pages.py links it
#   firmware    files, protocol verbs and events, bring-up example in
#               mouse-joystick-firm; the circuit-to-code map reads these
#   explode     axis and signed order for the exploded view (station frame,
#               section 6 of the documentation plan): axis z runs along the
#               lever axis, positive away from the lever, negative toward it;
#               axis y positive is down, negative up. Entries sharing an order
#               move together, and the offsets come from clearance between
#               bounding boxes (render.py explode), not from a fixed step.
#               Order 0 or omitted = stays in place (the motor mount plate is
#               the anchor). `{hide: true}` omits the entry from the exploded
#               views (fasteners, bearings); `{ignore: true}` keeps it in place
#               without letting its box push the others (the frame standoffs)
#   look        finish from scene.yaml `looks`, read off the photos of the real
#               parts (2026-10-13), not the model's appearance names;
#               looks_by_material / looks_by_node override it for a part with
#               several finishes (brake end caps, the motor shaft)
#   render      true = an isolated render and a component page
#   bom         true = a row in the mechanical BOM (instances counted from the glTF)
#   confirm     open questions for Sam Jager or the bench, printed on the page
#
# Units in this file and in scene.yaml: metres, the glTF's own frame (Y up,
# the base plate's long axis along Z).

- id: lever
  name: Joystick lever
  kind: mechanical
  station: both
  gltf_nodes: ["MCL LEVER:*"]
  look: stainless
  vendor: Janelia (custom)
  description: >-
    The lever the mouse holds. Rides on the lever axis at the front of the
    station; a pull moves it toward decreasing angle on both stations.
  explode: {axis: z, order: -2}
  render: true
  bom: true
  confirm: ["Material and finish of the lever (not in the model)."]

- id: gear-train
  name: Spur gear pair
  kind: mechanical
  station: both
  gltf_nodes: ["Spur Gears:*", "DRIVEN SPUR GEAR MIR:*"]
  look: black-plastic
  vendor: Janelia (custom)
  description: >-
    Driving gear on the motor shaft, driven gear on the lever axis. The
    mirrored station has its own driven gear. The gear ratio is the number the
    firmware's angle scaling depends on.
  firmware:
    files: [src/Conversions.hpp]
    notes: "gear ratio and microsteps per lever degree live here"
  explode: {axis: z, order: -1}
  render: true
  bom: true
  confirm: ["Tooth counts of the driving and driven gears, to check against src/Conversions.hpp."]

- id: motor
  name: Stepper motor
  kind: mechanical
  station: both
  gltf_nodes: ["LIN ENGINEERING 208-13-01D:*"]
  look: black-anodized
  looks_by_node: {"Solid1": stainless}
  vendor: Lin Engineering
  part_number: 208-13-01D
  datasheet: mouse-joystick-pcb/docs/datasheets/motor.pdf
  description: >-
    The motor that presents, parks and homes the lever through the gear pair.
    Rated 0.6 A per phase; the firmware runs it below that.
  connects_to:
    - {board: mouse-joystick-pcb, connector: J1102, cable: harness}
  block_instance: motor_encoder_switch/tmc5130
  firmware:
    files: [src/TmcMotion.hpp, src/MotionSetup.hpp, src/TmcSpi.hpp, src/TmcRegisters.hpp]
    protocol: [HOME, MOVETO, ARM, STOP, "ev TARGET", "ev HOMED"]
    bringup: [examples/TMC5130Communication, examples/MotionAndHoming, docs/motion-bringup.md]
  explode: {axis: z, order: 1}
  render: true
  bom: true

- id: encoder
  name: Lever-axis encoder
  kind: mechanical
  station: both
  gltf_nodes: ["US DIGITAL E4T-200-157-S-H-M-B:*"]
  look: black-plastic
  vendor: US Digital
  part_number: E4T-200-157-S-H-M-B
  datasheet: mouse-joystick-pcb/docs/datasheets/encoder.pdf
  description: >-
    Optical kit encoder. Its A and B channels reach the board's encoder input
    and are counted by the TMC5130A, not by the RP2040; the firmware reads the
    count over SPI.
  connects_to:
    - {board: mouse-joystick-pcb, connector: J1103, cable: harness}
  block_instance: motor_encoder_switch/quadrature_encoder_input_5v_sn74lvc2g17
  firmware:
    files: [src/TmcMotion.hpp, src/Conversions.hpp]
    protocol: ["STATUS (angle)", "ev TARGET"]
    bringup: [examples/MotionAndHoming, docs/motion-bringup.md]
  explode: {axis: z, order: 1}
  render: true
  bom: true
  confirm:
    - "The model names a 200 CPR disk (E4T-200) while the bring-up log confirms 1000 CPR against 51200 microsteps per revolution; which part is fitted?"

- id: limit-switch
  name: Limit switch
  kind: mechanical
  station: both
  gltf_nodes: ["D2F_01FL:*"]
  look: black-plastic
  vendor: Omron
  part_number: D2F-01FL
  description: >-
    Subminiature basic switch with a lever actuator at the positive end of
    travel. The firmware homes against it and uses it as the hardware stop
    for negative motion through the driver's reference input.
  connects_to:
    - {board: mouse-joystick-pcb, connector: J1601, cable: harness}
  block_instance: motor_encoder_switch/limit_switch_debounced_input_vertical
  firmware:
    files: [src/MotionSetup.hpp, src/TmcMotion.hpp]
    protocol: [HOME, "ev HOMED"]
    bringup: [examples/MotionAndHoming]
  explode: {axis: y, order: -1}
  render: true
  bom: true

- id: brake
  name: Magnetic particle brake
  kind: mechanical
  station: both
  gltf_nodes: ["PLACID INDUSTRIES B5Z-1R:*"]
  look: black-anodized
  looks_by_material: {AluminumPolished: aluminium, StainlessBrushed: stainless}
  vendor: Placid Industries
  part_number: B5Z-1R
  datasheet: mouse-joystick-pcb/docs/datasheets/brake.pdf
  description: >-
    On the lever axis behind the gear. The board's current sink drives its
    coil from 0 to about 49 mA to set the resistance the mouse feels while the
    lever is released.
  connects_to:
    - {board: mouse-joystick-pcb, connector: J1801, cable: brake-lead}
  block_instance: brake_torque_sensor/brake_current_sink_0_49ma_dac80501
  firmware:
    files: [src/BrakeTorqueHw.hpp, src/BrakeTorqueBackend.hpp, src/DAC80501Device.hpp]
    protocol: [BRAKE, "ev RELEASED", "~BRAKE_FAULT in the fault mask"]
    bringup: [examples/BrakeAndTorque, docs/brake-torque-bringup.md]
  explode: {axis: z, order: 1}
  render: true
  bom: true

- id: torque-sensor
  name: Reaction torque sensor
  kind: mechanical
  station: both
  gltf_nodes: ["TransducerTechniquesRTS5:*"]
  look: black-anodized
  looks_by_material: {AluminumPolished: aluminium, Default: aluminium, Metal2400FHot: stainless}
  vendor: Transducer Techniques
  part_number: RTS-5
  datasheet: mouse-joystick-pcb/docs/datasheets/torque-sensor-specs.png
  description: >-
    350 ohm bridge, 1.5 mV/V, 5 in-oz, at the rear of the lever axis. The
    board excites it, amplifies it, samples it at 1 kHz and puts a copy on the
    torque BNC. The left station reads a pull negative where the right reads
    positive.
  connects_to:
    - {board: mouse-joystick-pcb, connector: J2001, cable: torque-lead}
  block_instance: brake_torque_sensor/torque_bridge_0_3v3_ina821
  firmware:
    files: [src/BrakeTorqueHw.hpp, src/ADS8689Device.hpp, src/BoardCalibration.hpp]
    protocol: [TQ, "STATUS (torque)", "ev TOUCH", "ev PULL / PUSH"]
    bringup: [examples/BrakeAndTorque, docs/brake-torque-bringup.md]
  explode: {axis: z, order: 3}
  render: true
  bom: true

- id: shaft-couplers
  name: Shaft couplers
  kind: mechanical
  station: both
  gltf_nodes: ["CouplerBrakeSide:*", "Coupler-SensorSide:*"]
  look: aluminium
  vendor: Janelia (custom)
  description: >-
