  render: false

- id: cameras
  name: Blackfly S cameras
  kind: external
  station: rig
  description: Triggered at 150 Hz through the camera interface board.
  render: false

- id: acquisition-pc
  name: Acquisition PC
  kind: external
  station: rig
  description: pyControl GUI, SpikeGLX, the camera scripts; every board's USB.
  render: false
