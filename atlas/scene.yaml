# Scene definition for atlas/render.py.
#
# Frame: the glTF's own, as exported from Inventor: metres, Y up, the base
# plate's long axis along Z, the right station at Z > 0 and the left (mirrored)
# station at Z < 0. Every vector in this file is in that frame; render.py
# converts to Blender's Z-up frame on import ((x, y, z) -> (x, -z, y)).
#
# Measured from mouse-joysticks.glb on 2026-10-13:
#   whole assembly        x -0.099..0.050  y -0.010..0.140  z -0.182..0.182
#   dual base plate       76 x 10 x 349 mm, top face at y = 0
#   right station         centre (-0.023, 0.068, 0.088); lever at z 0.009..0.016,
#                         torque sensor at z 0.066..0.114 (the lever axis runs +Z)
#   left station          centre (-0.025, 0.065, -0.088); the mirror image
#   lever axis            y 0.078, x about -0.015 (brake, driven gear, torque sensor)
#   motor axis            y 0.043, x about -0.019

units: metres
model: mouse-joysticks.glb

stations:
  right: {root: "GEAR DRIVEN SINGLE LEVER:1", z_sign: 1}
  left:  {root: "GEAR DRIVEN SINGLE LEVER:2", z_sign: -1}
# Scene-root nodes that are not under a station root belong to the station on
# their side of z = 0, except the base plate, which belongs to the rig.
rig_nodes: ["DUAL BASE PLATE:*"]

# The controller boards, as a placement study (mouse-joystick-pcb
# docs/rig-layout.md and docs/connector-access-2026-09-21.md): each board
# stands on its long edge under its station, component side facing -X, the
# terminal-block edge up toward the mechanism. Reproduces docs/rig-layout.png
# approximately; the enclosure decision is open and nothing here fixes it.
# `rotation_deg` is X, Y, Z rotations about the glTF axes applied in that
# order, before `position`. The board glTF has the board in its XZ plane,
# component side +Y, KiCad's top edge (the terminal blocks, J1102/J1103/J1601)
# at small Z: checked 2026-10-13 against U501 (36 V switch, top left) and U201
# (USB, lower left). [0, -90, 90] stands it up with the top edge up and the
# components facing -X.
boards:
  joystick-board:
    file: atlas/boards/mouse-joystick-pcb.glb
    instances:
      - {station: right, position: [-0.060, -0.040, 0.088], rotation_deg: [0, -90, 90]}
      - {station: left,  position: [-0.060, -0.040, -0.088], rotation_deg: [0, -90, 90]}
  camera-board:
    file: atlas/boards/camera-gpio-interface-pcb.glb
    instances: []        # not placed in the mechanical renders; it sits elsewhere on the rig

explode:
  step: 0.025            # metres per unit of `explode.order` in the registry
  factors: [0.25, 0.5, 1.0]
  # axis z: along the station's lever axis away from the lever (+Z on the
  #         right station, -Z on the left); axis y: downward.

render:
  engine: CYCLES
  samples: 256                 # adaptive: most pixels stop far earlier
  preview_samples: 64
  adaptive_threshold: 0.01
  long_side_px: 1600
  hero_long_side_px: 2400
  preview_long_side_px: 800
  film_transparent: false
  view_transform: AgX
  look: "AgX - Medium High Contrast"
  exposure: 0.0
  # A studio: three area lights placed relative to the subject's bounding
  # sphere (radius R), a neutral world for ambient fill and reflections, and a
  # matte floor just under the lowest visible part so every view has contact
  # shadows. Powers are for R = 0.2 m and scale with R squared.
  world: {color: [0.42, 0.43, 0.45], strength: 0.45}
  floor: {color: [0.46, 0.47, 0.49], roughness: 0.9, size_factor: 40}
  studio:
    key:  {direction: [-1.0, 1.3, 0.7], distance: 3.0, size: 2.0, watts: 26}
    fill: {direction: [1.2, 0.6, 0.9], distance: 3.5, size: 3.0, watts: 9}
    rim:  {direction: [0.4, 1.1, -1.3], distance: 3.0, size: 1.5, watts: 14}
  # Isolation views: the subject keeps its looks, everything else becomes an
  # unlit flat grey silhouette, and Freestyle draws outlines: a dark, thicker
  # line around the subject, a thin light one around the context.
  isolate:
    context_color: [0.72, 0.73, 0.75]
    subject_line: {color: [0.08, 0.08, 0.1], thickness: 2.4}
    context_line: {color: [0.40, 0.41, 0.44], thickness: 0.7}
    crease_angle_deg: 110
  # Every mesh gets a "look" from the palette below: the registry entry's
  # `look` (and its `looks_by_material` / `looks_by_node` overrides for parts
  # with several finishes), else the Inventor appearance name through
  # `material_looks`. The board models keep their own KiCad materials.
  looks:
    aluminium:      {base: [0.70, 0.71, 0.73], metallic: 1.0, roughness: 0.38}
    stainless:      {base: [0.62, 0.62, 0.64], metallic: 1.0, roughness: 0.26}
    black-anodized: {base: [0.035, 0.035, 0.040], metallic: 0.6, roughness: 0.42}
    black-plastic:  {base: [0.020, 0.020, 0.022], metallic: 0.0, roughness: 0.48}
    grey-plastic:   {base: [0.30, 0.31, 0.33], metallic: 0.0, roughness: 0.55}
    blue-anodized:  {base: [0.05, 0.12, 0.45], metallic: 0.5, roughness: 0.40}
    brass:          {base: [0.78, 0.56, 0.20], metallic: 1.0, roughness: 0.35}
    label-white:    {base: [0.88, 0.88, 0.86], metallic: 0.0, roughness: 0.75}
  material_looks:               # Inventor appearance -> look, the fallback
    PolishedBrushedVersion11: aluminium
    AluminumPolished: aluminium
    Default: aluminium
    Steel: aluminium
    M196196196: aluminium
    SmoothNavy: aluminium       # the motor mount plate is machined aluminium in the photos
    StainlessBrushed: stainless
    Metal2400FHot: stainless
    SmoothBlack: black-anodized
    BlackAnodize: black-anodized
    SmoothMediumGray: black-anodized
    M646464: black-anodized
    Gray: black-anodized
    Walnut: grey-plastic
    M255255255: grey-plastic
    M221232255: grey-plastic
    M165158150: grey-plastic
    BrassSatin: brass

# Camera `direction` is the vector from the subject's centre to the camera;
# `fill` is the fraction of the frame the subject's projected bounds occupy.
views:
  - id: rig-iso
    subject: all
    hero: true
    camera: {kind: perspective, direction: [-1.0, 0.55, 0.8], fill: 0.90, aspect: [3, 2]}
  - id: rig-with-boards-iso
    subject: all
    boards: true
    camera: {kind: perspective, direction: [-1.0, 0.55, 0.8], fill: 0.90, aspect: [3, 2]}
  - id: rig-top
    subject: all
    camera: {kind: ortho, direction: [0, 1, 0], up: [-1, 0, 0], fill: 0.92}
  - id: rig-front
    subject: all
    camera: {kind: ortho, direction: [-1, 0, 0], fill: 0.92}
  - id: rig-side
    subject: all
    camera: {kind: ortho, direction: [0, 0, 1], fill: 0.92}
  - id: station-iso
    subject: station:right
    camera: {kind: perspective, direction: [-1.0, 0.6, 0.9], fill: 0.88, aspect: [4, 3]}
  - id: station-exploded-25
    subject: station:right
    explode: 0.25
    camera: {kind: perspective, direction: [-1.0, 0.6, 0.9], fill: 0.88, aspect: [4, 3]}
  - id: station-exploded-50
    subject: station:right
    explode: 0.5
    camera: {kind: perspective, direction: [-1.0, 0.6, 0.9], fill: 0.88, aspect: [4, 3]}
  - id: station-exploded-100
    subject: station:right
    explode: 1.0
    camera: {kind: perspective, direction: [-1.0, 0.6, 0.9], fill: 0.88, aspect: [4, 3]}
  # One view per registry entry with `render: true`: the entry's right-station
  # instance opaque, the rest of that station and the base plate ghosted, the
  # left station hidden, the camera framed on the entry.
  - id: part-{id}
    per_part: true
    subject: entry:right
    others: isolate
    hide: station:left
    camera: {kind: perspective, direction: [-1.0, 0.7, 0.9], fill: 0.45, aspect: [4, 3]}
